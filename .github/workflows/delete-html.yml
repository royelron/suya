
name: Delete HTML Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete HTML files in xxc
        run: |
          find xxc -type f -iname '*.html' -delete

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A xxc
          if ! git diff --cached --quiet; then
            git commit -m "Delete all HTML files in xxc"
            git push
          else
            echo "No HTML files to delete"
          fi
