name: Update All HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace hol.js with xp.js
        run: |
          OLD='<script src="https://cdn.jsdelivr.net/gh/hamarirani7-sys/rt@main/hol.js"></script>'
          NEW='<script src="https://cdn.jsdelivr.net/gh/hamarirani7-sys/rt@main/xp.js"></script>'

          find . -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            sed -i "s|$OLD|$NEW|g" "$file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.html'

          if git diff --cached --quiet; then
            echo "No changes found."
          else
            git commit -m "Update hol.js to xp.js"
            git push
          fi
